<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket watch</title>
<style>
  :root { --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --line: #e6e5e1; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header, main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 20px; margin: 0; flex-basis: 100%; }
  form { display: flex; gap: 8px; flex: 1 1 360px; }
  input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; }
  button { font: inherit; padding: 6px 10px; cursor: pointer; }
  [aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  #msg { flex-basis: 100%; margin: 0; color: var(--ink2); min-height: 1.4em; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .top { display: flex; align-items: start; gap: 8px; }
  h2 { font-size: 17px; margin: 0; flex: 1; }
  h2 a { color: inherit; }
  .plot { position: relative; height: 320px; margin: 12px 0; }
  ul { list-style: none; padding: 0; margin: 0; columns: 2 240px; color: var(--ink2); }
  li { break-inside: avoid; padding: 2px 0; }
  li i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  li b { color: var(--ink); font-weight: 600; }
  details { margin-top: 8px; color: var(--ink2); }
  details button { margin: 4px 4px 0 0; }
  .err { color: #d03b3b; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw=="
        crossorigin="anonymous"></script>
<script src="lib.js"></script>
</head>
<body>
<header>
  <h1>Polymarket watch</h1>
  <form id="add">
    <input id="url" aria-label="Event link" placeholder="Paste a polymarket.com/event/… link">
    <button>Add</button>
  </form>
  <div role="group" aria-label="Time range">
    <button data-r="1d" aria-pressed="true">1 day</button>
    <button data-r="1w" aria-pressed="false">1 week</button>
    <button data-r="1m" aria-pressed="false">1 month</button>
  </div>
  <button id="refresh">Refresh</button>
  <p id="msg" role="status"></p>
</header>
<main id="events"></main>
<script>
const GAMMA = 'https://gamma-api.polymarket.com', CLOB = 'https://clob.polymarket.com';
const CEASEFIRE = 'israel-x-iran-ceasefire-continues-throughptptpt-20260716224448963';
const DEFAULTS = [
  'who-will-be-the-next-prime-minister-of-israel-after-the-next-election',
  CEASEFIRE,
];
const FIDELITY = { '1d': 10, '1w': 60, '1m': 240 }; // minutes per history point
const TICK = { '1d': 3 * 3600e3, '1w': 86400e3, '1m': 7 * 86400e3 }; // x-axis tick step, ms
const RANGE_NAME = { '1d': '1 day', '1w': '1 week', '1m': '1 month' };
const SPAN = { '1d': 86400, '1w': 7 * 86400, '1m': 30 * 86400 }; // seconds
// dataviz reference palette: categorical in fixed order (9th+ series go gray, never cycled);
// date-ladder bars: blue ramp step 250 for the range start, 450 for now.
const CATEGORICAL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const BAR_THEN = '#86b6ef', BAR_NOW = '#2a78d6';
const MUTED = '#898781', GRID = '#ecebe7', INK2 = '#52514e';

const main = document.getElementById('events'), msg = document.getElementById('msg');
const input = document.getElementById('url');

function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
let range = '1d', slugs = load('pm.events', DEFAULTS);
// Events switched to show No; ceasefire starts on No. Key is v2 because v1 ('pm.no') was written as []
// by any add/remove in earlier versions, which would hide the new default on browsers that used them.
const NO_KEY = 'pm.no.v2';
const noSide = new Set(load(NO_KEY, [CEASEFIRE]));
const save = () => { store('pm.events', slugs); store(NO_KEY, [...noSide]); };

async function getJSON(url) {
  const r = await fetch(url).catch(() => { throw new Error('Could not reach Polymarket.'); });
  if (!r.ok) throw new Error(`Polymarket API error ${r.status}`);
  return r.json();
}
const history = (token) =>
  getJSON(`${CLOB}/prices-history?market=${token}&interval=${range}&fidelity=${FIDELITY[range]}`).then((d) => d.history || []);
// The price at the start of the selected range, or null for a market that opened inside it.
// Computed once per fetch (not per redraw) so it stays consistent with the history it came from.
const rangeStart = (m, hist) => startPoint(hist, Date.now() / 1000 - SPAN[range], m.opened);

const pct = (p) => (p * 100).toFixed(1) + '%';
const fmt = (ms, opts) => new Date(ms).toLocaleString([], opts);
const WHEN = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
const Y_AXIS = { beginAtZero: true, grid: { color: GRID }, ticks: { color: MUTED, callback: (v) => v + '%' } };
const LEGEND = { labels: { boxWidth: 10, boxHeight: 10, color: INK2 } };

// Hover: nearest point of every visible line (series have their own timestamps, so 'index' mode won't align).
Chart.Interaction.modes.eachNearest = (chart, e) => {
  const { x } = Chart.helpers.getRelativePosition(e, chart);
  return chart.getSortedVisibleDatasetMetas().flatMap((meta) => {
    let best = -1;
    meta.data.forEach((el, i) => { if (best < 0 || Math.abs(el.x - x) < Math.abs(meta.data[best].x - x)) best = i; });
    return best < 0 ? [] : [{ element: meta.data[best], datasetIndex: meta.index, index: best }];
  });
};

// lines = [{m: market from pickMarkets, hist: [{t, p}], start: rangeStart point or null, color}];
// val maps a Yes price to the side shown.
function lineChart(canvas, lines, val) {
  return new Chart(canvas, {
    type: 'line',
    data: {
      datasets: lines.map(({ m, hist, color }) => ({
        label: m.label, data: hist.map((h) => ({ x: h.t * 1000, y: val(h.p) * 100 })),
        borderColor: color, backgroundColor: color,
      })),
    },
    options: {
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'eachNearest', intersect: false },
      elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2 } },
      scales: {
        x: {
          type: 'linear', bounds: 'data', grid: { color: GRID },
          afterBuildTicks: (s) => { // round local hours/days; Chart.js would start at the first data point
            const step = TICK[range], tz = new Date().getTimezoneOffset() * 60e3;
            s.ticks = [];
            for (let v = Math.ceil((s.min - tz) / step) * step + tz; v <= s.max; v += step) s.ticks.push({ value: v });
          },
          ticks: {
            maxRotation: 0, color: MUTED,
            callback: (v) => fmt(v, range === '1d' ? { hour: '2-digit', minute: '2-digit' } : { day: 'numeric', month: 'short' }),
          },
        },
        y: Y_AXIS,
      },
      plugins: {
        legend: LEGEND,
        tooltip: {
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: {
            title: (items) => fmt(items[0].parsed.x, WHEN),
            label: (it) => ` ${it.dataset.label}: ${it.parsed.y.toFixed(1)}%`,
          },
        },
      },
    },
  });
}

// Date ladders: one pair of bars per date, range start (line.start: point nearest now − SPAN,
// none for dates opened inside the range) beside now.
function barChart(canvas, lines, val) {
  const start = lines.map((l) => l.start);
  return new Chart(canvas, {
    type: 'bar',
    data: {
      labels: lines.map((l) => l.m.label),
      datasets: [
        { label: `${RANGE_NAME[range]} ago`, data: start.map((h) => (h ? val(h.p) * 100 : null)), backgroundColor: BAR_THEN },
        { label: 'Now', data: lines.map((l) => val(l.m.price) * 100), backgroundColor: BAR_NOW },
      ],
    },
    options: {
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      datasets: { bar: { borderRadius: 4 } },
      scales: { x: { grid: { display: false }, ticks: { color: MUTED } }, y: Y_AXIS },
      plugins: {
        legend: LEGEND,
        tooltip: {
          filter: (it) => it.parsed.y != null, // no earlier bar for dates that opened inside the range
          callbacks: {
            label: (it) => {
              const h = it.datasetIndex === 0 && start[it.dataIndex];
              return ` ${it.dataset.label}${h ? ` (${fmt(h.t * 1000, WHEN)})` : ''}: ${it.parsed.y.toFixed(1)}%`;
            },
          },
        },
      },
    },
  });
}

function renderAll() {
  main.querySelectorAll('canvas').forEach((c) => Chart.getChart(c)?.destroy());
  main.replaceChildren();
  slugs.forEach(renderEvent);
  msg.textContent = `Loaded ${fmt(Date.now(), { hour: '2-digit', minute: '2-digit' })}`;
}

async function renderEvent(slug) {
  const card = document.createElement('section');
  const stale = () => !card.isConnected; // removed by X or replaced by a re-render: drop in-flight results
  card.innerHTML = '<div class="top"><h2></h2><button class="x">✕</button></div>';
  const h2 = card.querySelector('h2'), x = card.querySelector('.x');
  h2.textContent = `Loading ${slug}…`;
  x.setAttribute('aria-label', `Remove ${slug}`);
  let chart;
  x.onclick = () => {
    slugs = slugs.filter((s) => s !== slug);
    noSide.delete(slug);
    save();
    card.remove();
    chart?.destroy();
  };
  main.append(card);
  const note = (text, cls = '') => card.append(Object.assign(document.createElement('p'), { textContent: text, className: cls }));

  try {
    const [ev] = await getJSON(`${GAMMA}/events?slug=${encodeURIComponent(slug)}`);
    if (stale()) return;
    if (!ev) throw new Error('Event not found. Check the link.');
    h2.replaceChildren(Object.assign(document.createElement('a'),
      { href: `https://polymarket.com/event/${slug}`, target: '_blank', rel: 'noopener', textContent: ev.title }));
    x.setAttribute('aria-label', `Remove ${ev.title}`);

    const { shown, hidden, ladder } = pickMarkets(ev);
    if (!shown.length && !hidden.length) return note('All markets in this event are resolved.');

    // ponytail: No = 1 - Yes (Polymarket's No trades at ~1 - Yes);
    // fetch the No token's own history (clobTokenIds[1]) if that ever visibly drifts.
    const val = (p) => (noSide.has(slug) ? 1 - p : p);
    const sideText = (p) => `${noSide.has(slug) ? 'No ' : ''}${pct(val(p))}`; // say "No" so the list can't be misread

    const plot = Object.assign(document.createElement('div'), { className: 'plot' });
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', `Chart: ${ev.title}`);
    plot.append(canvas);
    const list = document.createElement('ul');
    card.append(plot, list);

    let failed = 0;
    const histories = await Promise.all(shown.map((m) => history(m.token).catch(() => (failed++, []))));
    if (stale()) return;
    // Bars identify dates by their axis label, so ladder lines need no color.
    const lines = shown.map((m, i) => ({
      m, hist: histories[i], start: rangeStart(m, histories[i]), color: ladder ? null : CATEGORICAL[i] || MUTED,
    }));
    const hiddenButtons = [];

    // Yes/No switch, added only once it works (after the data is in).
    const sides = document.createElement('span');
    sides.setAttribute('role', 'group');
    sides.setAttribute('aria-label', `Show Yes or No for ${ev.title}`);
    sides.innerHTML = '<button data-s="yes">Yes</button> <button data-s="no">No</button>';
    x.before(sides);

    const draw = () => {
      const no = noSide.has(slug);
      sides.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.s === 'no') === no));
      canvas.setAttribute('aria-label', `Chart: ${ev.title}, showing ${no ? 'No' : 'Yes'} — current values are listed below it`);
      chart?.destroy();
      chart = (ladder ? barChart : lineChart)(canvas, lines, val);
      list.replaceChildren(...lines.map(({ m, hist, start, color }) => {
        const c = change24h(hist.map((h) => ({ t: h.t, p: val(h.p) })), val(m.price));
        const d = c == null ? 0 : Math.round(c * 1000) / 10; // -0.04 -> +0.0, not -0.0
        const li = document.createElement('li');
        li.innerHTML = '<i aria-hidden="true"></i><b></b> <span></span>';
        if (color) li.querySelector('i').style.background = color;
        else li.querySelector('i').remove();
        li.querySelector('b').textContent = m.label;
        li.querySelector('span').textContent = `${sideText(m.price)}, ` +
          (c == null ? 'no 24h history' : `${d >= 0 ? '+' : '-'}${Math.abs(d).toFixed(1)} pts in 24h`);
        if (ladder && hist.length) { // the bar chart's range-start value, as text
          li.querySelector('span').textContent += start ? `, ${pct(val(start.p))} ${RANGE_NAME[range]} ago`
            : `, opened ${fmt(m.opened * 1000, { day: 'numeric', month: 'short' })}`;
        }
        return li;
      }));
      for (const [b, m] of hiddenButtons) b.textContent = `${m.label} ${sideText(m.price)}`;
    };
    sides.onclick = (e) => {
      const s = e.target.dataset?.s;
      if (!s) return;
      if (s === 'no') noSide.add(slug);
      else noSide.delete(slug);
      // not save(): don't rewrite the event list another tab may have changed.
      // ponytail: the No list itself is last-tab-wins; re-read it from storage before writing if multi-tab ever matters.
      store(NO_KEY, [...noSide]);
      draw();
    };
    draw();
    if (failed) note(`Price history didn't load for ${failed} of ${shown.length} markets. Try Refresh.`, 'err');

    if (hidden.length) {
      const d = document.createElement('details');
      const summary = (n) => `${n} more (Yes under 1%)`;
      d.innerHTML = `<summary>${summary(hidden.length)}</summary>`;
      for (const m of hidden) {
        const b = document.createElement('button');
        hiddenButtons.push([b, m]);
        b.textContent = `${m.label} ${sideText(m.price)}`;
        b.onclick = async () => {
          b.disabled = true;
          const hist = await history(m.token).catch(() => null);
          if (stale()) return;
          if (!hist) {
            b.disabled = false;
            b.focus();
            msg.textContent = `Couldn't load ${m.label}. Try again.`;
            return;
          }
          lines.push({ m, hist, start: rangeStart(m, hist), color: ladder ? null : CATEGORICAL[lines.length] || MUTED });
          if (ladder) lines.sort((p, q) => p.m.endDate.localeCompare(q.m.endDate));
          hiddenButtons.splice(hiddenButtons.findIndex(([hb]) => hb === b), 1);
          const next = b.nextElementSibling || b.previousElementSibling; // keep keyboard focus nearby
          b.remove();
          draw();
          msg.textContent = `Added ${m.label}.`;
          if (hiddenButtons.length) {
            d.querySelector('summary').textContent = summary(hiddenButtons.length);
            next.focus();
          } else {
            d.remove();
            h2.querySelector('a')?.focus();
          }
        };
        d.append(b);
      }
      card.append(d);
    }
  } catch (e) {
    if (stale()) return;
    if (!h2.firstElementChild) h2.textContent = slug; // drop "Loading…" when the title never arrived
    note(e.message, 'err');
  }
}

document.getElementById('add').onsubmit = (e) => {
  e.preventDefault();
  const slug = slugFromInput(input.value);
  if (!slug) return void (msg.textContent = 'Paste a Polymarket event link, like polymarket.com/event/…');
  if (slugs.includes(slug)) return void (msg.textContent = 'That event is already on the page.');
  slugs.push(slug);
  save();
  input.value = '';
  msg.textContent = '';
  renderEvent(slug);
};
for (const b of document.querySelectorAll('[data-r]')) b.onclick = () => {
  range = b.dataset.r;
  document.querySelectorAll('[data-r]').forEach((o) => o.setAttribute('aria-pressed', o === b));
  renderAll();
};
document.getElementById('refresh').onclick = renderAll;
renderAll();
</script>
</body>
</html>
